name: Repro setup-node #1556

on: workflow_dispatch

jobs:
  issue1556:
    runs-on: ubuntu-22.04
    steps:
      # Poison the toolcache with an empty directory for the requested version
      - name: Simulate partial extract / failed download
        run: |
          version="22.12.0"
          arch="x64"
          tool_dir="$RUNNER_TOOL_CACHE/node/${version}/${arch}"
          mkdir -p "${tool_dir}/bin"
          touch "${tool_dir}.complete"   # marks the cache entry as "valid"
          echo "Poisoned toolcache at ${tool_dir}"

      - name: Setup Node (should request 22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      # Demonstrates the silent fallthrough — reports the runner-baked version
      - name: Check actual node version
        run: |
          echo "node path: $(which node)"
          echo "node version: $(node --version)"
          node --version | grep -q "v22.12.0" || {
            echo "::error::Expected v22.12.0 but got $(node --version) — setup-node silently fell through!"
            exit 1
          }