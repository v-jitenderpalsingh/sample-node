name: Issue 1556 Repro Workflow
on: [workflow_dispatch]

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - name: Show runner-baked Node version
        run: node --version
        
      - name: Setup Node with network simulation
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
        # In real scenario: transient network failure during download
        
      - name: Check Node version after setup-node
        run: |
          echo "Expected: v24.15.0"
          echo "Actual: $(node --version)"
          
      - name: This step will fail with confusing errors
        run: |
          # Test would fail here with ELIFECYCLE or native module errors
          # instead of a clear "Node provisioning failed" message
          node --version