name: Test Node

on: [push, workflow_dispatch]

jobs:
  demo:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: '24'
      
      - run: |
          node --version
          ls -la
          npm config get userconfig
          npm ci