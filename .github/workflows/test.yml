name: Test Workflow
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
        

      - name: Run Main
        run: |
          node main.js
          node -v
          npm -v
          npm install -g npm@^10
          npm -v