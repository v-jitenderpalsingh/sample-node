name: Test workflow

on: [push, workflow_dispatch]

jobs:
  test-retry:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: v-jitenderpalsingh/setup-node@test-retry
        with:
          node-version: '20'

      - name: Verify install succeeded
        run: |
          node -v
      
      - name: setup node 18
        uses: v-jitenderpalsingh/setup-node@test-retry
        with:
          node-version: '18'
      
      - name: Verify install succeeded
        run: |
          node -v
      
      - name: setup node 22
        uses: v-jitenderpalsingh/setup-node@test-retry
        with:
          node-version: '22'

      - name: Verify install succeeded
        run: |
          node -v