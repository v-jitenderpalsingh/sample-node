name: Test workflow

on: [push, workflow_dispatch]

jobs:
  multi-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node 20
        uses: v-jitenderpalsingh/setup-node@test-retry
        with:
          node-version: '20'

      - name: Confirm Node 20 is active
        run: |
          echo "node is: $(which node)"
          node --version  

      - name: Persist Node 20 on PATH via $GITHUB_ENV
        run: echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Install Node 22 (expected to FAIL verifyNodeVersion)
        uses: v-jitenderpalsingh/setup-node@test-retry
        with:
          node-version: '22'