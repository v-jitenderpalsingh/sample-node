name: Test workflow

on: [push, workflow_dispatch]

jobs:
  test-retry:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: v-jitenderpalsingh/setup-node@test-retry

      - name: Verify install succeeded
        run: |
          node -v
  
  test-v6:
    name: Test v6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6

      - name: Verify install succeeded
        run: |
          node -v