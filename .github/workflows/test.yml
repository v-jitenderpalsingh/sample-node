name: Test Node

on: [push, workflow_dispatch]
defaults:
  run:
    shell: bash

jobs:
  demo:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@main

      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Verify Node installation
        run: |
          node --version
          npm --version
          npm ci

      - name: Again setup node
        uses: actions/setup-node@main
        with:
          node-version: '24'
          cache: 'npm'
          