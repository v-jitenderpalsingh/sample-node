name: Test Workflow
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: v-jitenderpalsingh/setup-node@test-retry
        with:
          node-version: '21'

      - name: Run Main
        run: |
          node main.js
          node -v
          
      