name: Test Node

on: [push, workflow_dispatch]
defaults:
  run:
    shell: bash

jobs:
  demo:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: '24'
      
      - name: Run Node and NPM commands
        run: |
          node --version
          pwd
          npm config get userconfig

      - name: Run npm ci
        run: |
          npm ci