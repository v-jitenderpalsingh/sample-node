name: Test workflow

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        id: setup-node
        uses: gowridurgad/setup-node@cachekey-output
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Check output
        run: |
            echo "node-version:       ${{ steps.setup-node.outputs.node-version }}"
            echo "cache-hit:          ${{ steps.setup-node.outputs.cache-hit }}"
            echo "cache-primary-key:  ${{ steps.setup-node.outputs.cache-primary-key }}"
            echo "cache-matched-key:  ${{ steps.setup-node.outputs.cache-matched-key }}"