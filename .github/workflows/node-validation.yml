name: Verify Node Version Validation
on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: HarithaVattikuti/setup-node@b983d7404f95e4d7ba3fdbd33b6f42b9e7a8c3a8
        with:
          node-version: '24'

      - name: Check actual node version
        run: |
          node --version